<!DOCTYPE html>

<html class="h-full" lang="en"><head>

<style>
        .material-symbols-outlined {
            font-variation-settings: 'FILL' 0, 'wght' 400, 'GRAD' 0, 'opsz' 24;
        }
    </style>
<style>
    body {
      min-height: max(884px, 100dvh);
    }
  </style>
  </head>
<body class="bg-background text-on-background h-full font-sans antialiased overflow-y-auto">
<!-- Top Navigation (Task-Focused: No Bottom Nav) -->
<header class="bg-surface dark:bg-surface-dim shadow-sm w-full top-0 sticky z-40 flex justify-between items-center px-margin-mobile h-16">
<button class="p-2 -ml-2 rounded-full hover:bg-surface-container-low transition-colors active:scale-95 duration-150 text-primary">
<span class="material-symbols-outlined">arrow_back</span>
</button>
<h1 class="font-headline-lg-mobile text-headline-lg-mobile text-on-surface truncate">Statistik Kehadiran</h1>
<button class="p-2 -mr-2 rounded-full hover:bg-surface-container-low transition-colors active:scale-95 duration-150 text-primary">
<span class="material-symbols-outlined">download</span>
</button>
</header>
<main class="max-w-[480px] mx-auto pb-lg">
<!-- Filter Controls -->
<section class="px-margin-mobile pt-lg pb-md">
<div class="flex space-x-2 mb-md overflow-x-auto no-scrollbar">
<button class="px-4 py-2 rounded-full bg-primary-container text-on-primary font-label-md text-label-md whitespace-nowrap active:scale-95 transition-transform">Mingguan</button>
<button class="px-4 py-2 rounded-full bg-surface-container text-on-surface font-label-md text-label-md whitespace-nowrap active:scale-95 transition-transform hover:bg-surface-container-high">Bulanan</button>
<button class="px-4 py-2 rounded-full bg-surface-container text-on-surface font-label-md text-label-md whitespace-nowrap active:scale-95 transition-transform hover:bg-surface-container-high">Semester</button>
</div>
<div class="relative">
<select class="w-full appearance-none bg-surface-container-lowest border border-outline-variant text-on-surface rounded-lg px-4 py-3 font-body-md text-body-md focus:border-primary-container focus:ring-0 focus:outline-none transition-colors">
<option>Pilih Kelas: XI RPL 1</option>
<option>Pilih Kelas: XI RPL 2</option>
</select>
<div class="pointer-events-none absolute inset-y-0 right-0 flex items-center px-4 text-on-surface-variant">
<span class="material-symbols-outlined">expand_more</span>
</div>
</div>
</section>
<!-- Main Analytics Chart -->
<section class="px-margin-mobile pb-md">
<div class="bg-surface-container-lowest rounded-xl shadow-[0px_4px_12px_rgba(0,0,0,0.05)] p-md overflow-hidden relative">
<div class="flex justify-between items-baseline mb-sm">
<h2 class="font-body-md text-body-md text-on-surface-variant">Tren Mingguan</h2>
<span class="font-label-sm text-label-sm text-primary-container bg-secondary-container px-2 py-1 rounded-full">+2.4%</span>
</div>
<!-- SVG Chart Mockup -->
<div class="h-48 w-full relative mt-4">
<svg class="w-full h-full overflow-visible" preserveaspectratio="none" viewbox="0 0 400 150">
<!-- Grid lines -->
<line stroke="#f1f1f1" stroke-width="1" x1="0" x2="400" y1="0" y2="0"></line>
<line stroke="#f1f1f1" stroke-width="1" x1="0" x2="400" y1="50" y2="50"></line>
<line stroke="#f1f1f1" stroke-width="1" x1="0" x2="400" y1="100" y2="100"></line>
<line stroke="#f1f1f1" stroke-width="1" x1="0" x2="400" y1="150" y2="150"></line>
<!-- Gradient Fill -->
<lineargradient id="chart-gradient" x1="0%" x2="0%" y1="0%" y2="100%">
<stop offset="0%" stop-color="#006B33" stop-opacity="0.2"></stop>
<stop offset="100%" stop-color="#006B33" stop-opacity="0"></stop>
</lineargradient>
<path d="M0,120 C50,110 100,50 150,60 C200,70 250,20 300,40 C350,60 400,30 400,30 L400,150 L0,150 Z" fill="url(#chart-gradient)"></path>
<!-- Line -->
<path d="M0,120 C50,110 100,50 150,60 C200,70 250,20 300,40 C350,60 400,30 400,30" fill="none" stroke="#006B33" stroke-linecap="round" stroke-width="3"></path>
<!-- Data Points -->
<circle cx="150" cy="60" fill="#ffffff" r="4" stroke="#006B33" stroke-width="2"></circle>
<circle cx="300" cy="40" fill="#ffffff" r="4" stroke="#006B33" stroke-width="2"></circle>
<circle cx="400" cy="30" fill="#ffffff" r="4" stroke="#006B33" stroke-width="2"></circle>
</svg>
<!-- X-Axis Labels -->
<div class="absolute bottom-[-24px] w-full flex justify-between px-2 font-label-sm text-label-sm text-on-surface-variant">
<span>Sen</span>
<span>Sel</span>
<span>Rab</span>
<span>Kam</span>
<span>Jum</span>
</div>
</div>
<div class="mt-8 border-t border-surface-variant pt-2 flex justify-between items-center">
<span class="font-label-sm text-label-sm text-on-surface-variant">Target: 95%</span>
</div>
</div>
</section>
<!-- Key Metrics Cards -->
<section class="px-margin-mobile pb-lg grid grid-cols-2 gap-sm">
<div class="bg-surface-container-lowest rounded-xl shadow-[0px_4px_12px_rgba(0,0,0,0.05)] p-md flex flex-col justify-center">
<span class="material-symbols-outlined text-primary-container mb-2" style="font-variation-settings: 'FILL' 1;">groups</span>
<h3 class="font-label-sm text-label-sm text-on-surface-variant">Rata-rata Kelas</h3>
<p class="font-headline-md text-headline-md text-on-surface mt-1">94%</p>
</div>
<div class="bg-surface-container-lowest rounded-xl shadow-[0px_4px_12px_rgba(0,0,0,0.05)] p-md flex flex-col justify-center">
<span class="material-symbols-outlined text-error mb-2" style="font-variation-settings: 'FILL' 1;">trending_down</span>
<h3 class="font-label-sm text-label-sm text-on-surface-variant">Sesi Terendah</h3>
<p class="font-headline-md text-headline-md text-on-surface mt-1">85% <span class="text-sm font-normal text-on-surface-variant">(Senin)</span></p>
</div>
</section>
<!-- Attention Required Section -->
<section class="px-margin-mobile">
<h2 class="font-headline-sm text-headline-sm font-semibold text-on-surface mb-md">Perlu Perhatian (Bawah 90%)</h2>
<div class="space-y-sm">
<!-- Student 1 -->
<div class="bg-surface-container-lowest rounded-xl shadow-[0px_4px_12px_rgba(0,0,0,0.05)] p-md flex items-center justify-between">
<div class="flex items-center space-x-md">
<img class="w-12 h-12 rounded-full object-cover border-2 border-surface-variant" data-alt="A professional headshot of a male high school student wearing a neat uniform, soft natural lighting, light mode aesthetic, clean white background, minimalist composition." src="https://lh3.googleusercontent.com/aida-public/AB6AXuBA3wQrmcPRcv7P_bnmPQUn_xWq4uQFCpvIJDYjeoy5H2Tt4gS7PA2zrLwJ7Y7epcOteLE_SwFxxzUBQbF6s5Mg_dczfG-edPP0WwGZ2MGWqKzGPgm9yUMkzhhB-ciY96n0PTNpz0Hyj94CN2L1942GArdJRG8wtvOH_lW6OzO_uBWy6ig1ZViksEbAQElOVPh2Lj4RGUKAPK2d5eGKVRcvqKEmYd0bZy-aaqTr45I9PbsSz2sUWf6q5g"/>
<div>
<p class="font-body-md text-body-md font-medium text-on-surface">Budi Santoso</p>
<p class="font-label-sm text-label-sm text-on-surface-variant">NIS: 102938</p>
</div>
</div>
<div class="bg-error-container text-on-error-container font-label-md text-label-md px-3 py-1 rounded-full flex items-center">
<span class="material-symbols-outlined text-sm mr-1">warning</span>
                        82%
                    </div>
</div>
<!-- Student 2 -->
<div class="bg-surface-container-lowest rounded-xl shadow-[0px_4px_12px_rgba(0,0,0,0.05)] p-md flex items-center justify-between">
<div class="flex items-center space-x-md">
<img class="w-12 h-12 rounded-full object-cover border-2 border-surface-variant" data-alt="A professional headshot of a female high school student wearing a hijab and neat uniform, soft natural lighting, light mode aesthetic, clean white background, minimalist composition." src="https://lh3.googleusercontent.com/aida-public/AB6AXuDne1figGQ3dWbhh_aSkk4MLeaC6qal9W67ZrNfqjiwpHz0UmXYyJ_HWgeLlRfJEDtq_IG8Kop45atekaHCrPpfLU9LO5PPgVF3CJJVUYyjFDFEFAQsYh9xVdkd5n7rdHUp1eM0iJLxRVc36ew_SRvC9aHgPsdZBmaC3S_7wOvXzNTvAYZz6rgSgTMDJRy6Agw4vZ8_NVqvl_CDGeUe16HvMyFqs4ea3_m0VRU63iH2D4jH1rW-UQBtLA"/>
<div>
<p class="font-body-md text-body-md font-medium text-on-surface">Siti Aminah</p>
<p class="font-label-sm text-label-sm text-on-surface-variant">NIS: 102945</p>
</div>
</div>
<div class="bg-error-container text-on-error-container font-label-md text-label-md px-3 py-1 rounded-full flex items-center">
<span class="material-symbols-outlined text-sm mr-1">warning</span>
                        88%
                    </div>
</div>
</div>
</section>
</main>
</body></html>
