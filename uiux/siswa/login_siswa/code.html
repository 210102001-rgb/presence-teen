<style>
        .material-symbols-outlined {
            font-variation-settings: 'FILL' 0, 'wght' 400, 'GRAD' 0, 'opsz' 24;
            display: inline-block;
            line-height: 1;
        }
        body {
            background-color: #F8F9FA;
            font-family: 'Plus Jakarta Sans', sans-serif;
        }
        .soft-card-shadow {
            box-shadow: 0px 4px 20px rgba(0, 0, 0, 0.04);
        }
        .glass-effect {
            background: rgba(255, 255, 255, 0.8);
            backdrop-filter: blur(10px);
            border: 1px solid rgba(255, 255, 255, 0.3);
        }
        .input-transition {
            transition: all 0.2s cubic-bezier(0.4, 0, 0.2, 1);
        }
    </style>

<body class="bg-background text-on-background min-h-screen flex flex-col justify-center items-center overflow-x-hidden">
<!-- Decorative Elements -->
<div class="fixed top-[-10%] right-[-10%] w-64 h-64 bg-primary/5 rounded-full blur-3xl -z-10 animate-pulse"></div>
<div class="fixed bottom-[-10%] left-[-10%] w-96 h-96 bg-primary/10 rounded-full blur-3xl -z-10 animate-pulse" style="animation-delay: 2s;"></div>
<main class="w-full max-w-md px-margin-mobile flex flex-col items-center">
<!-- Logo Section -->
<div class="mb-lg animate-in fade-in slide-in-from-bottom-4 duration-700">
<img alt="Presence Teen Logo" class="w-24 h-24 object-contain" src="https://lh3.googleusercontent.com/aida-public/AB6AXuBi3uenAF5KTxK6QZf7tK0xlUnS802ntzVyL2ELRFObpx2QLv8Edg0_Xz6VNBbvOnr53xixdXCjAhYOPlT8RgB4iTi_Nr47WwD_TNCpPghH0jDuf6dlHrYgHZbil85RNG9ZFG_UKcz9mY0yFw69N7xS36xtTGflVpFDRySjFjFR5baYlA4tuRlk4x33wTJJZla5kvc-evND3VI8mU-c8eTmOrE6nVNwM5VI-xtLjXtro_atyE0A4AO31GyxvL5szBlm5wWdshOdRLk"/>
</div>
<!-- Header -->
<header class="text-center mb-xl animate-in fade-in slide-in-from-bottom-4 duration-700 delay-100">
<h1 class="font-headline-lg-mobile text-headline-lg-mobile md:font-headline-lg md:text-headline-lg text-primary tracking-tight">Selamat Datang, Teen!</h1>
<p class="font-body-md text-body-md text-tertiary mt-xs">Akses portal kehadiranmu dengan aman.</p>
</header>
<!-- Login Form Card -->
<div class="w-full bg-white rounded-2xl p-lg soft-card-shadow animate-in fade-in slide-in-from-bottom-8 duration-1000 delay-200">
<form action="#" class="space-y-md" method="POST">
<!-- Student ID Field -->
<div class="space-y-xs">
<label class="font-label-lg text-label-lg text-on-surface-variant block ml-1" for="student-id">Student ID</label>
<div class="relative group">
<span class="material-symbols-outlined absolute left-4 top-1/2 -translate-y-1/2 text-tertiary group-focus-within:text-primary transition-colors">person</span>
<input class="w-full pl-12 pr-4 py-4 bg-surface-container-low rounded-xl border-none focus:ring-2 focus:ring-primary focus:bg-white input-transition text-body-md placeholder:text-tertiary/60" id="student-id" placeholder="Masukkan ID Siswa" type="text"/>
</div>
</div>
<!-- Password Field -->
<div class="space-y-xs">
<div class="flex justify-between items-center px-1">
<label class="font-label-lg text-label-lg text-on-surface-variant" for="password">Password</label>
<a class="font-label-md text-label-md text-primary hover:underline transition-all" href="#">Lupa Password?</a>
</div>
<div class="relative group">
<span class="material-symbols-outlined absolute left-4 top-1/2 -translate-y-1/2 text-tertiary group-focus-within:text-primary transition-colors">lock</span>
<input class="w-full pl-12 pr-12 py-4 bg-surface-container-low rounded-xl border-none focus:ring-2 focus:ring-primary focus:bg-white input-transition text-body-md placeholder:text-tertiary/60" id="password" placeholder="Masukkan kata sandi" type="password"/>
<button class="absolute right-4 top-1/2 -translate-y-1/2 text-tertiary hover:text-primary transition-colors" onclick="togglePassword()" type="button">
<span class="material-symbols-outlined" id="eye-icon">visibility</span>
</button>
</div>
</div>
<!-- Action Button -->
<div class="pt-base">
<button class="w-full bg-primary text-on-primary py-4 rounded-xl font-label-lg text-label-lg hover:bg-on-primary-fixed-variant active:scale-95 transition-all shadow-md shadow-primary/20 flex justify-center items-center gap-2 group" type="submit">
                        Masuk
                        <span class="material-symbols-outlined text-[20px] group-hover:translate-x-1 transition-transform">arrow_forward</span>
</button>
</div>
</form>
<!-- Bottom Assistance -->
<div class="mt-xl text-center space-y-md">
<div class="flex items-center justify-center gap-2">
<div class="h-[1px] w-12 bg-outline-variant"></div>
<span class="font-label-md text-label-md text-tertiary">Bantuan Lainnya</span>
<div class="h-[1px] w-12 bg-outline-variant"></div>
</div>
<div class="grid grid-cols-2 gap-sm">
<a class="flex flex-col items-center justify-center p-md bg-surface-container rounded-xl hover:bg-surface-container-high transition-colors" href="#">
<span class="material-symbols-outlined text-tertiary mb-1">help</span>
<span class="font-label-md text-label-md text-tertiary">Panduan</span>
</a>
<a class="flex flex-col items-center justify-center p-md bg-surface-container rounded-xl hover:bg-surface-container-high transition-colors" href="#">
<span class="material-symbols-outlined text-tertiary mb-1">contact_support</span>
<span class="font-label-md text-label-md text-tertiary">Admin</span>
</a>
</div>
</div>
</div>
<!-- Footer -->
<footer class="mt-xl text-center pb-xl animate-in fade-in slide-in-from-bottom-2 duration-1000 delay-500">
<p class="font-label-md text-label-md text-tertiary-container">© 2024 Presence Teen. Bangga Menjadi Siswa.</p>
</footer>
</main>
<script>
        function togglePassword() {
            const passwordInput = document.getElementById('password');
            const eyeIcon = document.getElementById('eye-icon');
            if (passwordInput.type === 'password') {
                passwordInput.type = 'text';
                eyeIcon.textContent = 'visibility_off';
            } else {
                passwordInput.type = 'password';
                eyeIcon.textContent = 'visibility';
            }
        }

        // Simple form submission animation feedback
        document.querySelector('form').addEventListener('submit', function(e) {
            e.preventDefault();
            const btn = this.querySelector('button[type="submit"]');
            const originalContent = btn.innerHTML;
            btn.innerHTML = '<span class="animate-spin material-symbols-outlined">sync</span> Memproses...';
            btn.disabled = true;
            
            setTimeout(() => {
                // Mock redirect or feedback
                btn.innerHTML = 'Berhasil!';
                btn.classList.replace('bg-primary', 'bg-secondary-container');
                btn.classList.add('text-on-secondary-container');
                setTimeout(() => {
                    btn.innerHTML = originalContent;
                    btn.disabled = false;
                    btn.classList.replace('bg-secondary-container', 'bg-primary');
                    btn.classList.remove('text-on-secondary-container');
                }, 2000);
            }, 1500);
        });
    </script>
</body></html>
