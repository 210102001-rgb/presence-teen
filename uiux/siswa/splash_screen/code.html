<style>
        .material-symbols-outlined {
            font-variation-settings: 'FILL' 0, 'wght' 400, 'GRAD' 0, 'opsz' 24;
        }
        
        @keyframes float {
            0% { transform: translateY(0px); }
            50% { transform: translateY(-10px); }
            100% { transform: translateY(0px); }
        }

        @keyframes fadeInScale {
            0% { opacity: 0; transform: scale(0.9); }
            100% { opacity: 1; transform: scale(1); }
        }

        .animate-float {
            animation: float 4s ease-in-out infinite;
        }

        .animate-entrance {
            animation: fadeInScale 1s cubic-bezier(0.16, 1, 0.3, 1) forwards;
        }

        .canvas-bg {
            background: radial-gradient(circle at 50% 50%, rgba(102, 223, 117, 0.05) 0%, rgba(248, 249, 250, 0) 70%);
        }
    </style>

<body class="bg-surface text-on-background font-body-md overflow-hidden antialiased">

<main class="relative h-screen w-full flex flex-col items-center justify-center canvas-bg">

<div class="w-1.5 h-1.5 rounded-full bg-primary animate-bounce" style="animation-delay: 0s"></div>

</main>
<!-- Micro-interaction for screen tap -->
<script>
        document.body.addEventListener('click', () => {
            // Simulate navigation ripple or haptic-style transition
            const ripple = document.createElement('div');
            ripple.className = 'fixed top-1/2 left-1/2 -translate-x-1/2 -translate-y-1/2 w-0 h-0 bg-primary opacity-10 rounded-full pointer-events-none transition-all duration-700 ease-out z-50';
            document.body.appendChild(ripple);
            
            requestAnimationFrame(() => {
                ripple.style.width = '300vw';
                ripple.style.height = '300vw';
                ripple.style.opacity = '0';
            });
            
            setTimeout(() => ripple.remove(), 700);
        });
    </script>
