<style>
        body {
            font-family: 'Inter', sans-serif;
            background-color: #333333; /* Specific dark gray requested */
            margin: 0;
            height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
        }

            font-variation-settings: 'FILL' 0, 'wght' 400, 'GRAD' 0, 'opsz' 24;
        }

      min-height: max(884px, 100dvh);

<body>
<div class="bg-surface rounded-xl w-[90%] max-w-[340px] p-lg flex flex-col items-center text-center shadow-lg transform transition-all">
<!-- Icon -->
<div class="mb-md bg-error-container text-error rounded-full p-3 flex items-center justify-center">
<span class="material-symbols-outlined text-4xl" data-icon="warning" data-weight="fill" style="font-variation-settings: 'FILL' 1;">warning</span>
</div>
<!-- Title -->
<h2 class="font-headline-md text-headline-md text-on-surface mb-sm">Akhiri Sesi Sekarang?</h2>
<!-- Description -->
<p class="font-body-md text-body-md text-on-surface-variant mb-xl px-xs">
            Apakah Anda yakin ingin mengakhiri sesi presensi ini? QR Code tidak akan bisa di-scan lagi oleh siswa.
        </p>
<!-- Actions -->
<div class="flex w-full gap-sm">
<button class="flex-1 py-2 px-4 rounded-lg border border-outline text-on-surface font-label-md text-label-md hover:bg-surface-variant/50 transition-colors">
                Batal
            </button>
<button class="flex-1 py-2 px-4 rounded-lg bg-error text-on-error font-label-md text-label-md hover:bg-error/90 transition-colors shadow-sm">
                Ya, Akhiri
            </button>
</div>
