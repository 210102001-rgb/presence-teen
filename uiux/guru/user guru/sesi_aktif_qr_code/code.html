<body class="bg-background text-on-background h-screen flex flex-col antialiased selection:bg-primary-container selection:text-on-primary-container relative">
<!-- Suppressed BottomNavBar and TopAppBar (Context: Linear/Transactional/Task-Focused flow with 'Close' action) -->
<!-- Header (Task-Focused) -->

<button class="w-10 h-10 flex items-center justify-center text-on-surface-variant hover:bg-surface-variant rounded-full transition-colors active:scale-95">
<span class="material-symbols-outlined" style="font-variation-settings: 'FILL' 0;">close</span>
</button>
</header>
<!-- Main Content -->
<main class="flex-1 overflow-y-auto px-margin-mobile py-md flex flex-col items-center justify-start w-full max-w-container-max mx-auto pb-32">
<!-- Session Info -->
<div class="w-full text-center mb-lg space-y-unit">
<h2 class="font-headline-lg-mobile text-headline-lg-mobile text-primary">Matematika - XI RPL 1</h2>
<p class="font-body-md text-body-md text-on-surface-variant">Topik: Persamaan Kuadrat</p>
</div>
<!-- QR Focus Card -->
<div class="w-full max-w-[340px] bg-surface-container-lowest rounded-[16px] shadow-[0px_4px_12px_rgba(0,0,0,0.05)] p-lg flex flex-col items-center justify-center mb-xl relative">
<!-- Simulated QR Code (Placeholder Image) -->
<div class="w-full aspect-square bg-surface-variant rounded-lg mb-lg flex items-center justify-center relative overflow-hidden p-xs">
<img class="w-full h-full object-cover rounded-md" data-alt="A highly detailed close up of a complex QR code pattern printed cleanly on a stark white background. The image is brightly lit with high key studio lighting, emphasizing the sharp contrast between the black geometric blocks of the QR code and the pure white background. The style is modern, minimalist, and utilitarian, fitting a professional digital interface." src="https://lh3.googleusercontent.com/aida-public/AB6AXuBRk4dODMMCr66vm-y4fG-4CMFoQy2GkREQnDqWEZ9a3IKzjmTzMuBn_BD2EcDdOpp-ooFw-BWmGoSrray2ahJsxzSJYMiIgUR_RWXE5dCdLMVN7w_hZeNvZ3B-HDSLYynQu3z142yCzP7-ahM1LoYH6Gu4_DDbVlNn6hJSj-9mmL8EW8WduMihEz-Gj8562hYZuFy84vxyOHn8kxwwX0wk005W8PodHEYAjNyFc_H4xEeIgdgqbGwrRQ"/>
</div>

<div class="w-full flex flex-col items-center gap-sm">
<p class="font-label-md text-label-md text-primary-container flex items-center gap-xs">
<span class="material-symbols-outlined text-[16px]" style="font-variation-settings: 'FILL' 0;">refresh</span>
                    QR Code refresh in <span class="font-bold" id="countdown">00:08s</span>
</p>
<div class="w-full h-1 bg-surface-variant rounded-full overflow-hidden">
<div class="h-full bg-primary-container rounded-full progress-bar-animation"></div>
</div>
</div>
</div>
<!-- Live Metrics -->
<div class="w-full max-w-[340px] grid grid-cols-2 gap-md">
<div class="bg-surface-container-low rounded-lg p-md flex flex-col items-center justify-center gap-unit text-center border border-surface-container-highest">
<span class="material-symbols-outlined text-secondary" style="font-variation-settings: 'FILL' 0;">timer</span>
<p class="font-label-sm text-label-sm text-on-surface-variant">Sisa Waktu Sesi</p>
<p class="font-headline-md text-headline-md text-on-surface">00:45:12</p>
</div>
<div class="bg-surface-container-low rounded-lg p-md flex flex-col items-center justify-center gap-unit text-center border border-surface-container-highest">
<span class="material-symbols-outlined text-secondary" style="font-variation-settings: 'FILL' 1;">groups</span>
<p class="font-label-sm text-label-sm text-on-surface-variant">Siswa Hadir</p>

<!-- Minimal Script for Countdown -->
<script>
        document.addEventListener('DOMContentLoaded', () => {
            const countdownEl = document.getElementById('countdown');
            let timeLeft = 8;

            setInterval(() => {
                timeLeft--;
                if (timeLeft < 0) {
                    timeLeft = 8;
                }
                countdownEl.textContent = `00:0${timeLeft}s`;
            }, 1000);
        });
    </script>
