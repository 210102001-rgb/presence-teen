<body class="bg-background h-full text-on-surface antialiased selection:bg-primary-container selection:text-on-primary-container">
<div class="flex min-h-screen">
<!-- Left Column: Illustration -->
<div class="hidden lg:flex lg:w-1/2 bg-surface-container-low relative items-center justify-center overflow-hidden border-r border-outline-variant/30">
<!-- Decorative background elements -->
<div class="absolute inset-0 z-0 opacity-40">
<div class="absolute top-0 left-0 w-full h-full bg-[radial-gradient(ellipse_at_top_left,_var(--tw-gradient-stops))] from-primary-container/20 via-transparent to-transparent"></div>
<div class="absolute bottom-0 right-0 w-full h-full bg-[radial-gradient(ellipse_at_bottom_right,_var(--tw-gradient-stops))] from-secondary-container/20 via-transparent to-transparent"></div>
</div>
<div class="relative z-10 w-full max-w-lg px-8">
<!-- Using a placeholder for a school/education illustration -->
<div class="aspect-square w-full rounded-[32px] overflow-hidden bg-surface shadow-[0_10px_15px_-3px_rgba(0,0,0,0.1)] p-8 flex items-center justify-center">
<img alt="School Illustration" class="w-full h-full object-contain" data-alt="A modern, high-quality vector illustration depicting a professional school environment. The scene shows stylized teenage students engaging with academic materials on tablets, with a bright, welcoming educational facility in the background. The color palette emphasizes clean whites, professional primary green accents, and soft greys. The lighting is bright and encouraging, creating an optimistic and focused mood suitable for a premium educational SaaS platform." src="https://lh3.googleusercontent.com/aida-public/AB6AXuAkc9Xq_jfKrvgkp-49VK4jy60YXOqr3HgOE3vqBmAcoGlFHvH-zgKuE3VnoLsnxCSrR0Bs3SdspR0ukOY1ebiIoKwUpNb7moV0l3eNqbDbDBgeNs4xZtoKoJpgUF_mMkaDPPKgCWLYPBNB78uUEaa0TxZGMvCNI14tgF9m_qSQvcZsTulQ3btU32zaN4KR6BCT8sMonejO18eNrR9_zY61H3Mf-aR5Bw-9TnzlFHe4AtkAId1WO9HF_xEbsT_fTXFmi0ZG-xRj2S-k"/>
</div>
<div class="mt-12 text-center">
<h2 class="font-headline-lg text-headline-lg text-on-surface mb-4">Empowering Education</h2>
<p class="font-body-lg text-body-lg text-on-surface-variant max-w-md mx-auto">Streamline your school's daily operations with our comprehensive management system designed for modern educators and students.</p>
</div>
</div>
</div>
<!-- Right Column: Login Form -->
<div class="flex-1 flex flex-col justify-center px-4 sm:px-6 lg:px-20 xl:px-32 relative bg-surface-lowest">
<div class="w-full max-w-md mx-auto relative z-10">
<!-- Brand Header -->
<div class="text-center mb-10">
<div class="inline-flex items-center justify-center w-24 h-24 rounded-2xl bg-surface shadow-sm border border-outline-variant/20 mb-6 p-2">
<img alt="Presence Teen Logo" class="w-full h-full object-contain" src="https://lh3.googleusercontent.com/aida-public/AB6AXuBT8kp_Jfc9rmqP83IRWOnXoDG3nMNm4pVkKdfptASeNsj4j8BGuSZgt1A_mBI1F-L9-hJneAsoVAQ27Oe4ysmVZjrIOpoxxIECnOFIbw-8hHkBpnZXv38DPB5n4aVeIAHaB3-u5a4hDgimssAnCiZs21RgaX51-jbmpTGZsTgofI5Jpyg2Jl7OiGROKA_DZR8yHMg3trI2WZOdbr9Q0Pc56ek9yOBoVbM90SpCdmnK5Rb-5pb5nnkIUkOplh8cFqQ1f1zeRszBkU8U"/>
</div>
<h1 class="font-headline-lg text-headline-lg text-primary tracking-tight">Presence Teen</h1>
<p class="font-body-md text-body-md text-on-surface-variant mt-2">Sign in to manage your school</p>
</div>
<!-- Form Card -->
<div class="bg-surface-lowest rounded-xl shadow-[0_4px_6px_-1px_rgba(0,0,0,0.1),_0_2px_4px_-1px_rgba(0,0,0,0.06)] border border-outline-variant/10 p-8 sm:p-10">
<form action="#" class="space-y-6" method="POST">
<div>
<label class="block font-label-sm text-label-sm text-on-surface-variant mb-2" for="username">USERNAME / EMAIL</label>
<div class="relative mt-1">
<div class="absolute inset-y-0 left-0 pl-4 flex items-center pointer-events-none">
<span aria-hidden="true" class="material-symbols-outlined text-outline text-[20px]">person</span>
</div>
<input autocomplete="username" class="block w-full pl-11 pr-4 py-3 rounded-lg border-outline-variant/50 bg-surface-container-lowest text-on-surface focus:ring-2 focus:ring-primary focus:border-primary font-body-md text-body-md transition-shadow duration-200 shadow-sm hover:border-outline" id="username" name="username" placeholder="Enter your username" required="" type="text"/>
</div>
</div>
<div>
<label class="block font-label-sm text-label-sm text-on-surface-variant mb-2" for="password">PASSWORD</label>
<div class="relative mt-1">
<div class="absolute inset-y-0 left-0 pl-4 flex items-center pointer-events-none">
<span aria-hidden="true" class="material-symbols-outlined text-outline text-[20px]">lock</span>
</div>
<input autocomplete="current-password" class="block w-full pl-11 pr-10 py-3 rounded-lg border-outline-variant/50 bg-surface-container-lowest text-on-surface focus:ring-2 focus:ring-primary focus:border-primary font-body-md text-body-md transition-shadow duration-200 shadow-sm hover:border-outline" id="password" name="password" placeholder="Enter your password" required="" type="password"/>
<button class="absolute inset-y-0 right-0 pr-4 flex items-center text-outline hover:text-on-surface transition-colors cursor-pointer" onclick="togglePasswordVisibility()" type="button">
<span class="material-symbols-outlined text-[20px]" id="password-toggle-icon">visibility</span>
</button>
</div>
</div>
<div class="flex items-center justify-between mt-6">
<div class="flex items-center">
<input class="h-5 w-5 rounded-[4px] border-outline-variant text-primary focus:ring-primary bg-surface-container-lowest cursor-pointer transition-colors duration-200" id="remember-me" name="remember-me" type="checkbox"/>
<label class="ml-3 block font-body-md text-body-md text-on-surface-variant cursor-pointer" for="remember-me">
                                    Remember me
                                </label>
</div>
<div class="text-sm">
<a class="font-body-md text-body-md font-medium text-primary hover:text-primary-container transition-colors duration-200" href="#">
                                    Forgot password?
                                </a>
</div>
</div>
<div class="pt-2">
<button class="w-full flex justify-center py-3.5 px-4 border border-transparent rounded-[16px] shadow-sm font-title-md text-title-md text-white bg-primary-container hover:bg-primary focus:outline-none focus:ring-2 focus:ring-offset-2 focus:ring-primary transition-all duration-200 active:scale-[0.98]" type="submit">
                                Sign In
                            </button>
</div>
</form>
</div>
<!-- Footer links -->
<div class="mt-8 text-center flex justify-center space-x-6">
<a class="font-caption text-caption text-on-surface-variant hover:text-primary transition-colors" href="#">Privacy Policy</a>
<span class="text-outline-variant">•</span>
<a class="font-caption text-caption text-on-surface-variant hover:text-primary transition-colors" href="#">Terms of Service</a>
<span class="text-outline-variant">•</span>
<a class="font-caption text-caption text-on-surface-variant hover:text-primary transition-colors" href="#">Help Center</a>
</div>
</div>
</div>
</div>
<script>
        function togglePasswordVisibility() {
            const passwordInput = document.getElementById('password');
            const icon = document.getElementById('password-toggle-icon');
            
            if (passwordInput.type === 'password') {
                passwordInput.type = 'text';
                icon.textContent = 'visibility_off';
            } else {
                passwordInput.type = 'password';
                icon.textContent = 'visibility';
            }
        }
    </script>
</body></html>
